<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PERFORM 評価システム</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
    background: #f0f4f8; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    background: white; border-radius: 16px; padding: 40px 32px;
    width: 100%; max-width: 400px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10);
  }
  .logo { text-align: center; margin-bottom: 28px; }
  .logo-text { font-size: 32px; font-weight: 900; color: #2c3e50; letter-spacing: 3px; }
  .logo-text span { color: #2ab5a8; }
  .logo-sub  { font-size: 12px; color: #2ab5a8; margin-top: 6px; letter-spacing: 0.5px; }
  h2 { font-size: 18px; color: #333; margin-bottom: 18px; text-align: center; }

  /* 施設バナー（QRスキャン時） */
  .facility-banner {
    background: #f0faf4; border: 1.5px solid #9ae6b4;
    border-radius: 10px; padding: 12px 16px; margin-bottom: 18px;
    display: none;
  }
  .facility-banner .label { font-size: 11px; color: #888; font-weight: 700; text-transform: uppercase; margin-bottom: 3px; }
  .facility-banner .name  { font-size: 16px; font-weight: 700; color: #276749; }

  .role-btns { display: flex; gap: 12px; margin-bottom: 18px; }
  .role-btn {
    flex: 1; padding: 13px; border: 2px solid #ddd; border-radius: 10px;
    background: white; font-size: 15px; cursor: pointer; transition: all 0.2s; color: #555;
  }
  .role-btn.active {
    border-color: #2ab5a8; background: #f0faf4; color: #2ab5a8; font-weight: 700;
  }
  .field-label { display: block; font-size: 13px; color: #666; margin-bottom: 5px; font-weight: 600; }
  input[type="text"], input[type="password"] {
    width: 100%; padding: 12px 14px; border: 1.5px solid #ddd; border-radius: 8px;
    font-size: 16px; margin-bottom: 14px; outline: none; transition: border-color 0.2s;
  }
  input:focus { border-color: #2ab5a8; }
  .remember-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 18px; margin-top: -6px;
  }
  .remember-row input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: #2ab5a8; }
  .remember-row label { margin: 0; font-size: 13px; color: #666; font-weight: normal; cursor: pointer; }
  .btn-primary {
    width: 100%; padding: 14px; background: #2ab5a8; color: white;
    border: none; border-radius: 10px; font-size: 16px; font-weight: 700;
    cursor: pointer; transition: background 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-primary:hover:not(:disabled) { background: #1d8a80; }
  .btn-primary:disabled { background: #aaa; cursor: default; }

  /* 指導医選択時：ホーム画面のアクセントカラーをネイビー系に切り替えて一目で分かるようにする */
  body.role-evaluator { background: #eef1f5; transition: background 0.2s; }
  body.role-evaluator .logo-text span { color: #2c3e50; }
  body.role-evaluator .logo-sub { color: #2c3e50; }
  body.role-evaluator .role-btn.active { border-color: #2c3e50; background: #eef1f5; color: #2c3e50; }
  body.role-evaluator input:focus { border-color: #2c3e50; }
  body.role-evaluator .remember-row input[type="checkbox"] { accent-color: #2c3e50; }
  body.role-evaluator .btn-primary { background: #2c3e50; }
  body.role-evaluator .btn-primary:hover:not(:disabled) { background: #1a2c3d; }
  .spinner {
    width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4);
    border-top-color: white; border-radius: 50%;
    animation: spin 0.7s linear infinite; display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error {
    color: #e53e3e; font-size: 13px; margin-bottom: 12px; display: none;
    padding: 10px 12px; background: #fff5f5;
    border-radius: 6px; border-left: 3px solid #e53e3e;
  }
  .register-link {
    display: block; text-align: center; margin-top: 16px;
    color: #2ab5a8; font-size: 13px; text-decoration: none; font-weight: 600;
  }
  .register-link:hover { text-decoration: underline; }
  .hint { text-align: center; font-size: 11px; color: #ccc; margin-top: 14px; }

  /* 施設コード入力（手入力フォールバック） */
  #fcField { display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-text">PERF<span>O</span>RM</div>
    <div class="logo-sub">── 手術を評価し、学び、向上する ──</div>
  </div>
  <h2>ログイン</h2>

  <!-- QRスキャン時：施設名バナー -->
  <div class="facility-banner" id="facilityBanner">
    <div class="label">施設</div>
    <div class="name" id="bannerFacilityName"></div>
  </div>

  <div class="role-btns">
    <button class="role-btn active" id="btn-learner"   onclick="selectRole('learner')">学習者</button>
    <button class="role-btn"        id="btn-evaluator" onclick="selectRole('evaluator')">指導医</button>
  </div>

  <!-- 手入力フォールバック（QRなし時のみ表示） -->
  <div id="fcField">
    <label class="field-label">施設コード</label>
    <input type="text" id="facilityCode" placeholder="例: FAC001" autocomplete="off">
  </div>

  <label class="field-label">氏名</label>
  <input type="text" id="name" placeholder="氏名を入力" autocomplete="name">
  <label class="field-label">PINコード（6桁）</label>
  <input type="password" id="pin" placeholder="6桁のPIN" maxlength="6" inputmode="numeric"
    onkeydown="if(event.key==='Enter') doLogin()">

  <div class="remember-row">
    <input type="checkbox" id="rememberMe" checked>
    <label for="rememberMe">次回ログインを省略する（この端末に保存）</label>
  </div>
  <div class="error" id="err"></div>
  <button class="btn-primary" id="loginBtn" onclick="doLogin()">
    <span id="loginLabel">ログイン</span>
    <div class="spinner" id="spinner"></div>
  </button>
  <p class="hint">© PERFORM 評価システム</p>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxEv9821OOSjC4Hi8yZdnh2Cn6NG-8topX-j4MhiKUZ-sXHd3GPvZs8PSydl_yAsu4lvQ/exec';
const DEMO_MODE = GAS_URL === 'YOUR_GAS_WEB_APP_URL_HERE';

let currentRole     = 'learner';
let qrFacilityCode  = '';   // QRコードから取得した施設コード

// -------------------------------------------------------
// ページ読み込み時：URLパラメータ or 保存済みログイン情報を復元
// -------------------------------------------------------

window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(location.search);
  const fc = params.get('fc') || '';
  const fn = params.get('fn') || '';

  if (fc) {
    // QRスキャン経由 → 施設コードをバナー表示し、入力フィールドは隠す
    qrFacilityCode = fc.toUpperCase();
    document.getElementById('facilityBanner').style.display = 'block';
    document.getElementById('bannerFacilityName').textContent = fn || fc;
    document.getElementById('fcField').style.display = 'none';
  } else {
    // 直接アクセス → 施設コード入力欄を表示
    document.getElementById('fcField').style.display = 'block';
  }

  // 記憶済みログイン情報を復元
  const saved = JSON.parse(localStorage.getItem('perform_login') || '{}');
  if (saved.role)         selectRole(saved.role);
  if (saved.name)         document.getElementById('name').value = saved.name;
  if (saved.pin)          document.getElementById('pin').value  = saved.pin;
  if (!fc && saved.facilityCode)
    document.getElementById('facilityCode').value = saved.facilityCode;
});

function selectRole(role) {
  currentRole = role;
  document.getElementById('btn-learner').classList.toggle('active', role === 'learner');
  document.getElementById('btn-evaluator').classList.toggle('active', role === 'evaluator');
  document.body.classList.toggle('role-evaluator', role === 'evaluator');
}

function setLoading(on) {
  document.getElementById('loginBtn').disabled = on;
  document.getElementById('spinner').style.display = on ? 'block' : 'none';
  document.getElementById('loginLabel').textContent = on ? '確認中...' : 'ログイン';
}

function showError(msg) {
  const el = document.getElementById('err');
  el.textContent = msg; el.style.display = 'block';
}

async function doLogin() {
  // 施設コード：QR優先、なければ手入力
  const facilityCode = (qrFacilityCode || document.getElementById('facilityCode')?.value?.trim() || '').toUpperCase();
  const name = document.getElementById('name').value.trim();
  const pin  = document.getElementById('pin').value.trim();
  const remember = document.getElementById('rememberMe').checked;
  document.getElementById('err').style.display = 'none';

  if (!name || !pin)    { showError('氏名とPINを入力してください'); return; }
  if (pin.length < 6)   { showError('PINは6桁で入力してください'); return; }
  if (!facilityCode)    { showError('施設コードを入力するか、施設のQRコードをスキャンしてください'); return; }

  setLoading(true);
  try {
    const res = await gasCall({ action: 'login', facilityCode, name, pin });
    if (!res.success) { showError(res.error || 'ログイン失敗'); return; }
    if (res.role !== currentRole) {
      showError(`このアカウントは「${res.role === 'learner' ? '学習者' : '指導医'}」です`); return;
    }

    if (remember) {
      localStorage.setItem('perform_login', JSON.stringify({
        role: res.role, facilityCode: res.facilityCode, name: res.name, pin
      }));
    } else {
      localStorage.removeItem('perform_login');
    }

    sessionStorage.setItem('role',         res.role);
    sessionStorage.setItem('userId',       res.userId);
    sessionStorage.setItem('userName',     res.name);
    sessionStorage.setItem('facilityCode', res.facilityCode);
    sessionStorage.setItem('facilityName', res.facilityName || '');
    sessionStorage.setItem('department',   res.department   || '');
    sessionStorage.setItem('pin',          pin);

    location.href = res.role === 'learner' ? 'learner.html' : 'evaluator.html';
  } catch (e) {
    showError('接続エラー。しばらくしてから再試行してください。');
  } finally {
    setLoading(false);
  }
}

async function gasCall(data) {
  const res = await fetch(GAS_URL, {
    method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(data)
  });
  return res.json();
}
</script>
</body>
</html>
